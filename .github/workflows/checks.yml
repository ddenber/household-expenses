name: checks

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hem
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: hem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hem -d hem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://hem:test-only-password@localhost:5432/hem_test
      HEM_ALLOW_TEST_DB_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements-dev.txt
      - name: Run API tests against disposable PostgreSQL
        working-directory: apps/api
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps
      - name: Run web unit, types and lint checks
        working-directory: apps/web
        run: |
          npm test
          npm run typecheck
          npx eslint src
